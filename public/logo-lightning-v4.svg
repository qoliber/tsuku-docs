<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded rectangle with opacity -->
  <rect x="10" y="10" width="80" height="80" rx="10" fill="#667eea" opacity="0.1"/>

  <!-- Border frame -->
  <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="#667eea" stroke-width="3"/>

  <!-- T with lightning bolt integrated -->
  <g fill="#667eea">
    <!-- T letter (monospace style) -->
    <text x="50" y="62" font-family="'Courier New', 'Monaco', 'Consolas', monospace"
          font-size="40" font-weight="bold" text-anchor="middle">T</text>

    <!-- Lightning bolt overlay on T -->
    <path d="M 54 32 L 48 45 L 52 45 L 46 58"
          stroke="#667eea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
