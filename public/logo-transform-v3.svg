<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded rectangle with opacity -->
  <rect x="10" y="10" width="80" height="80" rx="10" fill="#667eea" opacity="0.1"/>

  <!-- Border frame -->
  <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="#667eea" stroke-width="3"/>

  <!-- Circular transformation arrows -->
  <g stroke="#667eea" fill="none" stroke-width="2.5" stroke-linecap="round">
    <!-- Top right arrow -->
    <path d="M 60 35 A 15 15 0 0 1 65 50"/>
    <path d="M 63 48 L 66 51 L 63 54" stroke-linejoin="round"/>

    <!-- Bottom right arrow -->
    <path d="M 65 50 A 15 15 0 0 1 50 65"/>
    <path d="M 48 63 L 51 66 L 54 63" stroke-linejoin="round"/>

    <!-- Bottom left arrow -->
    <path d="M 50 65 A 15 15 0 0 1 35 50"/>
    <path d="M 37 48 L 34 51 L 37 54" stroke-linejoin="round"/>

    <!-- Top left arrow -->
    <path d="M 35 50 A 15 15 0 0 1 50 35"/>
    <path d="M 48 37 L 51 34 L 54 37" stroke-linejoin="round"/>
  </g>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#667eea"/>
</svg>
