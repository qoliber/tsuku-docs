    <!-- Left bolt -->
    <path d="M 33 40 L 28 50 L 31 50 L 26 60 L 33 52 L 30 52 Z"/>

    <!-- Middle bolt -->
    <path d="M 53 40 L 48 50 L 51 50 L 46 60 L 53 52 L 50 52 Z"/>

    <!-- Right bolt -->
    <path d="M 73 40 L 68 50 L 71 50 L 66 60 L 73 52 L 70 52 Z"/>
  </g>
</svg>
