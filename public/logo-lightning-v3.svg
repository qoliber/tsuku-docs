<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded rectangle with opacity -->
  <rect x="10" y="10" width="80" height="80" rx="10" fill="#667eea" opacity="0.1"/>

  <!-- Border frame -->
  <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="#667eea" stroke-width="3"/>

  <!-- Three lightning bolts (3-stage pipeline: Lexer → Parser → Compiler) -->
