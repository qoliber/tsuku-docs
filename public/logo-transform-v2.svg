<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded rectangle with opacity -->
  <rect x="10" y="10" width="80" height="80" rx="10" fill="#667eea" opacity="0.1"/>

  <!-- Border frame -->
  <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="#667eea" stroke-width="3"/>

  <!-- Three-stage pipeline (Lexer → Parser → Compiler) -->
  <g fill="#667eea">
    <!-- Stage 1 -->
    <circle cx="30" cy="50" r="4"/>

    <!-- Arrow 1 -->
    <path d="M 35 50 L 42 50" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <path d="M 40 48 L 43 50 L 40 52" stroke="#667eea" stroke-width="2" stroke-linejoin="round" fill="none"/>

    <!-- Stage 2 -->
    <circle cx="50" cy="50" r="4"/>

    <!-- Arrow 2 -->
    <path d="M 55 50 L 62 50" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <path d="M 60 48 L 63 50 L 60 52" stroke="#667eea" stroke-width="2" stroke-linejoin="round" fill="none"/>

    <!-- Stage 3 -->
    <circle cx="70" cy="50" r="4"/>
  </g>
</svg>
