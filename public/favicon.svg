<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded rectangle with opacity -->
  <rect x="3" y="3" width="26" height="26" rx="3" fill="#667eea" opacity="0.1"/>

  <!-- Border frame -->
