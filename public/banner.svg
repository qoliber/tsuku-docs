<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="200" fill="#f9fafb"/>

  <!-- Logo box with border (same style as main logo) -->
  <g transform="translate(30, 50)">
    <!-- Background rounded rectangle with opacity -->
    <rect x="0" y="0" width="100" height="100" rx="10" fill="#667eea" opacity="0.1"/>
    <!-- Border frame -->
    <rect x="5" y="5" width="90" height="90" rx="8" fill="none" stroke="#667eea" stroke-width="3"/>
    <!-- @T in Inter -->
    <text x="50" y="68" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="40" font-weight="800" fill="#667eea" text-anchor="middle">@T</text>
  </g>

  <!-- Text: Tsuku -->
  <text x="160" y="95" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#1f2937">Tsuku</text>

  <!-- Tagline -->
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">Transform Data Into Any Format</text>

  <!-- Features -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    <text x="450" y="75">✓ CSV, XML, JSON, YAML</text>
    <text x="450" y="100">✓ Pattern Matching</text>
    <text x="450" y="125">✓ XSS Protection</text>
    <text x="620" y="75">✓ PHP 8.1+</text>
    <text x="620" y="100">✓ Zero Dependencies</text>
    <text x="620" y="125">✓ 88% Mutation Score</text>
  </g>
</svg>
