<form class="checkout" method="post" action="/checkout/shipping/save">
  <input type="hidden" name="form_key" value="f7Kq2Lw9">
  <div class="field">
    <label for="firstname">First name <span class="required">*</span></label>
    <input type="text" id="firstname" name="firstname" value="Anna" autocomplete="given-name" required>
  </div>
  <div class="field">
    <label for="email">Email <span class="required">*</span></label>
    <input type="email" id="email" name="email" value="anna@example.com" autocomplete="email" required>
    <small>We send the order confirmation here.</small>
  </div>
  <div class="field">
    <label for="telephone">Phone</label>
    <input type="tel" id="telephone" name="telephone" value="" autocomplete="tel">
    <small>Only used by the courier.</small>
  </div>
  <div class="field">
    <label for="country_id">Country <span class="required">*</span></label>
    <select id="country_id" name="country_id" required>
      <option value="BE">Belgium</option>
      <option value="DE">Germany</option>
      <option value="NL" selected>Netherlands</option>
    </select>
  </div>
  <div class="field">
    <label for="comment">Delivery note</label>
    <textarea id="comment" name="comment" rows="2">Ring twice &lt;3</textarea>
  </div>
  <button type="submit" class="btn">Continue to payment</button>
</form>
