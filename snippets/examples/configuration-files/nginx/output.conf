server {
    listen 443 ssl;
    http2 on;
    server_name staging.shop.example.com staging.shop.example.nl;
    root /var/www/shop/current/pub;

    ssl_certificate     /etc/letsencrypt/live/staging.shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.shop.example.com/privkey.pem;

    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/htpasswd/shop-staging;

    location = /thee {
        return 301 /tea;
    }

    location = /sale {
        return 301 /offers;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
